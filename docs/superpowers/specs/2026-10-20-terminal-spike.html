thub_pr"}, {"title": "boatraceopenapi/programs", "url": "https://github.com/boatraceopenapi/programs/pulls?q=is:pr+author:shimomo", "date": "2025-08-24T04:57:58", "type": "github_pr"}, {"title": "boatraceopenapi/programs", "url": "https://github.com/boatraceopenapi/programs/pulls?q=is:pr+author:shimomo", "date": "2025-08-17T01:47:43", "type": "github_pr"}, {"title": "boatraceopenapi/programs", "url": "https://github.com/boatraceopenapi/programs/pulls?q=is:pr+author:shimomo", "date": "2025-08-16T22:23:32", "type": "github_pr"}, {"title": "autorace/tokyo-sports-scraper", "url": "https://github.com/autorace/tokyo-sports-scraper/pulls?q=is:pr+author:shimomo", "date": "2025-08-14T01:59:14", "type": "github_pr"}, {"title": "autorace/tokyo-sports-scraper", "url": "https://github.com/autorace/tokyo-sports-scraper/pulls?q=is:pr+author:shimomo", "date": "2025-08-13T20:49:49", "type": "github_pr"}, {"title": "autorace/tokyo-sports-scraper", "url": "https://github.com/autorace/tokyo-sports-scraper/pulls?q=is:pr+author:shimomo", "date": "2025-08-12T23:22:47", "type": "github_pr"}], "counts": {"public_repos": 26, "followers": 12}, "built_at": "2026-10-19 18:14 UTC"}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const out = document.getElementById('out');
  const inputLine = document.getElementById('inputline');
  const input = document.getElementById('in');
  const skipHint = document.getElementById('skip');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOST = 'lapras';
  document.title = `${D.id}@${HOST}: ~`;

  // ---------- tiny DOM helpers ----------
  const h = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
    return n;
  };
  const s = (cls, text) => h('span', { class: cls }, text);
  const a = (text, href) => href ? h('a', { href, target: '_blank', rel: 'noopener' }, text) : text;
  const run = (cmd, label) => h('span', { class: 'run', onclick: (e) => { e.stopPropagation(); execute(cmd); } }, label || cmd);
  const print = (...kids) => { out.append(h('div', { class: 'line' }, ...kids)); };
  const block = (node) => { out.append(h('div', { class: 'block' }, node)); };
  const rows = (cols, items) => h('div', { class: 'rows', style: `grid-template-columns:${cols}` }, items.flat());
  const ps1 = () => [s('u', `${D.id}@${HOST}`), ':', s('p', '~'), '$ '];
  const scrollDown = () => window.scrollTo(0, document.body.scrollHeight);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pct = (p) => (p == null || p <= 0 ? '' : `top ${Math.max(1, Math.round(100 - p))}%`);
  const bar = (ratio, width = 24) => {
    const n = Math.round(Math.max(0, Math.min(1, ratio)) * width);
    return [s('g', '█'.repeat(n)), s('dim', '░'.repeat(width - n))];
  };

  // ---------- data views ----------
  const dirs = {
    articles: D.articles, talks: D.talks, repos: D.repos, events: D.events,
  };
  const nonEmptyDirs = Object.keys(dirs).filter((k) => dirs[k].length);
  const totalStars = D.repos.reduce((t, r) => t + r.stars, 0);
  const topLangs = [...D.langs].sort((x, y) => y.bytes - x.bytes);

  // Spike: hard-coded figlet-ish initials. The real build would render this from the name.
  const ART = String.raw`
 __   __  _____
 \ \ / / / ____|
  \ V / | (___
   | |   \___ \
   | |   ____) |
   |_|  |_____/ `.slice(1);

  const cmds = {
    help: {
      desc: 'このヘルプを表示',
      fn() {
        const list = Object.entries(cmds).filter(([, c]) => !c.hidden);
        block(h('div', {},
          h('div', {}, s('dim', 'クリックでも実行できます')),
          rows('max-content 1fr', list.map(([name, c]) => [run(c.usage || name), s('dim', c.desc)])),
        ));
      },
    },
    neofetch: {
      desc: 'プロフィールの概要',
      fn() {
        const kv = (k, ...v) => h('div', {}, h('b', {}, k), ': ', ...v);
        const info = h('div', { class: 'kv' },
          h('div', {}, s('g', D.id), '@', s('g', HOST)),
          h('div', { class: 'dim' }, '-'.repeat(D.id.length + HOST.length + 1)),
          kv('Name', D.name),
          D.occupation && kv('Role', D.occupation),
          D.description && kv('Bio', D.description),
          D.organization && kv('Org', D.organization),
          D.location && kv('Location', D.location),
          kv('Score', `tech ${D.scores.e.toFixed(2)} · biz ${D.scores.b.toFixed(2)} · infl ${D.scores.i.toFixed(2)}`, D.scores.e_pct != null ? s('dim', ` (tech ${pct(D.scores.e_pct)})`) : ''),
          topLangs.length > 0 && kv('Langs', topLangs.slice(0, 4).map((l) => l.name).join(', ')),
          kv('Repos', `${D.counts.public_repos} public · ★ ${totalStars}`),
          D.articles.length + D.talks.length + D.events.length > 0 && kv('Output', `${D.articles.length} articles · ${D.talks.length} talks · ${D.events.length} events`),
          h('div', { style: 'margin-top:6px' },
            ['#ff7b72', '#e3b341', '#7ee787', '#79c0ff', '#58a6ff', '#d2a8ff', '#c9d1d9'].map((c) => h('span', { class: 'swatch', style: `background:${c}` }))),
        );
        block(h('div', { class: 'neo' }, h('pre', {}, ART), info));
      },
    },
    whoami: { desc: '名前と肩書き', fn() { print(D.name, D.description ? s('dim', ` — ${D.description}`) : ''); } },
    ls: {
      usage: 'ls', desc: `一覧を表示（${nonEmptyDirs.join(' / ')}）`,
      fn(args, opt) {
        const target = (args.find((x) => !x.startsWith('-')) || '').replace(/^~\//, '').replace(/\/$/, '');
        if (!target) {
          print(...nonEmptyDirs.flatMap((dname) => [run(`ls ${dname}`, h('span', { class: 'b' }, `${dname}/`)), '  ']));
          return;
        }
        if (!(target in dirs)) { print(`ls: cannot access '${target}': No such file or directory`); return; }
        const items = dirs[target].slice(0, opt.limit ?? 10);
        if (!items.length) { print(s('dim', '(empty)')); return; }
        const views = {
          articles: () => rows('max-content minmax(0,1fr) max-content', items.map((x) => [s('dim', x.date), a(x.title, x.url), s('dim', x.source)])),
          talks: () => rows('max-content minmax(0,1fr)', items.map((x) => [s('dim', x.date), a(x.title, x.url)])),
          repos: () => rows('max-content max-content max-content minmax(0,1fr)', items.map((x) => [s('y', `★${x.stars}`), a(x.name, x.url), s('m', x.lang || '-'), s('dim', x.desc)])),
          events: () => rows('max-content minmax(0,1fr) max-content', items.map((x) => [s('dim', x.date), a(x.title, x.url), s('g', x.presenter ? 'speaker' : x.organizer ? 'organizer' : '')])),
        };
        block(views[target]());
        if (dirs[target].length > items.length) print(s('dim', `… ${dirs[target].length - items.length} more (ls ${target} | head -${dirs[target].length})`));
      },
    },
    score: {
      usage: 'lapras score', desc: 'LAPRAS のスコア',
      fn() {
        const sc = D.scores;
        block(rows('max-content max-content max-content max-content', [
          ['tech', sc.e, sc.e_pct], ['business', sc.b, null], ['influence', sc.i, null],
        ].map(([k, v, p]) => [k, s('y', v.toFixed(2)), h('span', {}, bar(v / 5)), s('dim', pct(p))])));
        const det = sc.details.filter((x) => x.score != null);
        if (det.length) {
          print(s('dim', 'tech score breakdown'));
          block(rows('max-content max-content max-content max-content', det.map((x) => [
            s('dim', `  ${x.key}`), s('y', x.score.toFixed(2)), h('span', {}, bar(x.score / 5, 16)), s('dim', pct(x.pct)),
          ])));
        }
      },
    },
    langs: {
      desc: 'よく書く言語',
      fn() {
        const total = topLangs.reduce((t, l) => t + l.bytes, 0) || 1;
        block(rows('max-content max-content max-content', topLangs.slice(0, 8).map((l) => [
          s('m', l.name), h('span', {}, bar(l.bytes / topLangs[0].bytes, 28)), s('dim', `${(l.bytes / total * 100).toFixed(1)}%`),
        ])));
      },
    },
    skills: {
      desc: 'スキルタグ',
      fn() { block(h('div', { class: 'tags' }, D.skills.slice(0, 24).map((t) => h('span', {}, s('dim', '['), s('c', t.name), s('dim', ']'))))); },
    },
    log: {
      usage: 'git log', desc: '最近の活動',
      fn(args, opt) {
        const hash = (str) => { let x = 0; for (const ch of str) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return x.toString(16).padStart(7, '0').slice(0, 7); };
        const items = D.activities.slice(0, opt.limit ?? 12);
        block(rows('max-content max-content max-content minmax(0,1fr)', items.map((x) => [
          s('y', hash(x.url + x.date)), s('dim', x.date.slice(0, 10)), s('g', `(${x.type})`), a(x.title, x.url),
        ])));
      },
    },
    open: {
      usage: 'open', desc: 'リンクを開く（open github など）',
      fn(args) {
        const key = args[0];
        if (!key) {
          block(rows('max-content minmax(0,1fr)', D.links.map((l) => [run(`open ${l.key}`, l.key), a(l.title || l.url, l.url)])));
          return;
        }
        const l = D.links.find((x) => x.key === key);
        if (!l) { print(`open: unknown target '${key}'. try `, run('open')); return; }
        print(s('dim', 'opening '), a(l.url, l.url), s('dim', ' …'));
        window.open(l.url, '_blank', 'noopener');
      },
    },
    'cat': {
      usage: 'cat README.md', desc: 'このページについて',
      fn(args) {
        if (args[0] && args[0].toLowerCase() !== 'readme.md') { print(`cat: ${args[0]}: No such file or directory`); return; }
        block(h('div', {},
          h('div', { class: 'c' }, '# README.md'),
          h('div', {}, 'このページは LAPRAS の公開 API から毎日自動で生成されています。'),
          h('div', {}, '自分の ID に書き換えるだけで、同じページを GitHub Pages に作れます。'),
          h('div', { class: 'dim' }, `built at ${D.built_at} · data: `, a('LAPRAS', D.links.find((x) => x.key === 'lapras')?.url)),
        ));
      },
    },
    history: { desc: '入力したコマンドの履歴', fn() { hist.forEach((c, i) => print(s('dim', String(i + 1).padStart(4)), '  ', c)); } },
    clear: { desc: '画面をクリア', fn() { out.replaceChildren(); } },
    sudo: {
      hidden: true,
      async fn(args) {
        if (args.join(' ').includes('hire')) {
          print(s('dim', `[sudo] password for recruiter: `), '********');
          await sleep(reduced ? 0 : 600);
          print(s('g', 'Access granted.'), ' 続きは ', a('LAPRAS', D.links.find((x) => x.key === 'lapras')?.url), ' でどうぞ。');
        } else {
          print(`recruiter is not in the sudoers file. This incident will be reported. `, s('dim', '(hint: sudo hire-me)'));
        }
      },
    },
    exit: { hidden: true, fn() { print('logout'); print(s('dim', '……と見せかけて、まだここにいます。'), run('help')); } },
    echo: { hidden: true, fn(args) { print(args.join(' ')); } },
  };
  const aliases = { lapras: 'score', git: 'log', about: 'cat', links: 'open', dir: 'ls', ll: 'ls' };

  // ---------- execution ----------
  const hist = [];
  let histIdx = 0;
  let busy = false;

  async function dispatch(line) {
    const [main, ...pipes] = line.split('|').map((x) => x.trim());
    const opt = {};
    for (const p of pipes) {
      const m = p.match(/^head(?:\s+-n)?\s+-?(\d+)$/);
      if (m) opt.limit = Number(m[1]);
    }
    let [name, ...args] = main.split(/\s+/).filter(Boolean);
    if (!name) return;
    if (name === 'lapras' && args[0] === 'score') args.shift();
    if (name === 'git' && args[0] === 'log') args.shift();
    name = aliases[name] || name;
    const c = cmds[name];
    if (!c) { print(`${name}: command not found. try `, run('help')); return; }
    await c.fn(args, opt);
  }

  async function execute(line, { echo = true } = {}) {
    if (echo) print(...ps1(), line);
    if (line.trim()) { hist.push(line); histIdx = hist.length; }
    await dispatch(line);
    scrollDown();
  }

  // ---------- boot sequence ----------
  let skipping = reduced;
  const boot = ['neofetch', 'ls articles | head -3', 'ls repos | head -5'];
  const skip = () => { skipping = true; };
  addEventListener('keydown', skip, { once: true });
  addEventListener('pointerdown', skip, { once: true });

  async function typeLine(cmd) {
    const typed = h('span', {});
    print(...ps1(), typed);
    const cursor = s('cursor', '');
    typed.after(cursor);
    if (!skipping) await sleep(350);
    for (const ch of cmd) {
      if (skipping) { typed.textContent = cmd; break; }
      typed.textContent += ch;
      scrollDown();
      await sleep(35 + Math.random() * 55);
    }
    if (!skipping) await sleep(220);
    cursor.remove();
    await execute(cmd, { echo: false });
    if (!skipping) await sleep(500);
  }

  (async () => {
    print(s('dim', `Last login: ${new Date().toDateString()} from lapras.com`));
    for (const cmd of boot) await typeLine(cmd);
    print(s('dim', 'type '), run('help'), s('dim', ' to see what else is here.'));
    skipHint.classList.add('gone');
    inputLine.querySelector('.ps1').replaceChildren(...ps1());
    inputLine.classList.add('on');
    input.focus({ preventScroll: true });
    scrollDown();
  })();

  // ---------- input ----------
  const complete = (val) => {
    const parts = val.split(/\s+/);
    let pool;
    if (parts.length === 1) pool = [...Object.keys(cmds).filter((k) => !cmds[k].hidden), 'git', 'lapras'];
    else if (parts[0] === 'ls') pool = nonEmptyDirs;
    else if (parts[0] === 'open') pool = D.links.map((l) => l.key);
    else if (parts[0] === 'lapras') pool = ['score'];
    else if (parts[0] === 'git') pool = ['log'];
    else return val;
    const last = parts.at(-1);
    const hits = pool.filter((p) => p.startsWith(last));
    if (hits.length === 1) { parts[parts.length - 1] = hits[0]; return parts.join(' ') + ' '; }
    if (hits.length > 1) { print(...ps1(), val); print(hits.join('  ')); scrollDown(); }
    return val;
  };

  input.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (busy) return;
      const v = input.value; input.value = '';
      busy = true;
      try { await execute(v); } finally { busy = false; }
    } else if (e.key === 'Tab') {
      e.preventDefault(); input.value = complete(input.value);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); if (histIdx > 0) input.value = hist[--histIdx];
    } else if (e.key === 'ArrowDown') {
      e.preventDefault(); histIdx = Math.min(hist.length, histIdx + 1); input.value = hist[histIdx] ?? '';
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); out.replaceChildren();
    } else if (e.key === 'c' && e.ctrlKey && !getSelection().toString()) {
      e.preventDefault(); print(...ps1(), input.value, '^C'); input.value = '';
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target.closest('a, .run') || getSelection().toString()) return;
    if (inputLine.classList.contains('on')) input.focus({ preventScroll: true });
  });
})();
</script>
</body>
