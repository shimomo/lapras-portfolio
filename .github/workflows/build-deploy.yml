name: build-deploy

# Builds and deploys on every push to main, by hand, and when daily.yml calls
# it. It carries no schedule on purpose: forks keep scheduled workflows
# disabled until each one is enabled by hand, while this one starts working
# as soon as the fork's Actions are turned on.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "tests/**", "**.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-deploy
      cancel-in-progress: false
    outputs:
      skipped: ${{ steps.build.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Upload site
        if: steps.build.outputs.skipped == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Commit data
        if: steps.build.outputs.skipped == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            lapras_id=$(node -p "require('./config.json').lapras_id")
            git commit -m "data: ${lapras_id} $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Turns on daily.yml, which a fork leaves disabled. Doing it after every
      # successful build also keeps the schedule alive: public repositories
      # stop scheduled workflows after 60 days without activity.
      - name: Turn on the daily rebuild
        if: steps.build.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"; then
            echo "daily.yml is enabled"
          else
            {
              echo "## 毎朝の自動更新を有効にできませんでした"
              echo ""
              echo "Actions タブで **daily** を選び、**Enable workflow** を押してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
